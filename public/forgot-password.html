<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password - ResumeFit</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="authwrap">
    <div class="brand" style="text-align:center;margin-bottom:24px;">Resume<span>Fit</span></div>
    <div class="authcard">

      <div id="stepEmail">
        <h1>Reset your password</h1>
        <p class="sub">Enter your account email and we'll send you a 6-digit reset code.</p>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <button id="sendCodeBtn" class="btn primary">Send reset code &rarr;</button>
        <div id="emailError" class="error" style="display:none;"></div>
      </div>

      <div id="stepReset" style="display:none;">
        <h1>Enter your code</h1>
        <p class="sub">If an account exists for <strong id="codeEmailLabel"></strong>, a code was just sent to it.</p>
        <div class="field">
          <label for="code">Reset code</label>
          <input type="text" id="code" placeholder="123456" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password">
        </div>
        <button id="resetBtn" class="btn primary">Reset password &rarr;</button>
        <div id="resetError" class="error" style="display:none;"></div>
      </div>

      <div class="authfoot">Remembered it? <a class="authlink" href="/login.html">Log in</a></div>
    </div>
  </div>
  <script src="/auth-common.js"></script>
  <script src="/forgot-password.js"></script>
</body>
</html>
