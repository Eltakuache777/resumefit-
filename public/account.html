<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - ResumeFit</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <div class="navbar">
      <a href="/">&larr; Back to app</a>
      <a href="#" id="adminLink" style="display:none;">Admin</a>
      <button id="logoutBtn">Log out</button>
    </div>

    <section class="card" style="max-width:480px;margin:20px auto;">
      <h1 style="font-size:22px;margin-top:0;">Account</h1>
      <p class="sub" id="accountSummary" style="margin-bottom:24px;"></p>

      <h2 style="font-size:16px;">Change email</h2>
      <div class="field">
        <label for="newEmail">New email</label>
        <input type="email" id="newEmail" autocomplete="email">
      </div>
      <button id="changeEmailBtn" class="btn primary">Update email &rarr;</button>
      <div id="emailError" class="error" style="display:none;"></div>
      <div id="emailSuccess" class="success" style="display:none;"></div>

      <hr style="border-color:var(--border);margin:28px 0;">

      <h2 style="font-size:16px;">Change password</h2>
      <div class="field">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" autocomplete="current-password">
      </div>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password">
      </div>
      <button id="changePasswordBtn" class="btn primary">Update password &rarr;</button>
      <div id="passwordError" class="error" style="display:none;"></div>
      <div id="passwordSuccess" class="success" style="display:none;"></div>
    </section>
  </main>
  <script src="/auth-common.js"></script>
  <script src="/account.js"></script>
</body>
</html>
