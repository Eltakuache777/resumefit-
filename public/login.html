<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - ResumeFit</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="authwrap">
    <div class="brand" style="text-align:center;margin-bottom:24px;">Resume<span>Fit</span></div>
    <div class="authcard">
      <h1>Welcome back</h1>
      <p class="sub">Log in to tailor your resume.</p>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="********" autocomplete="current-password">
      </div>
      <button id="loginBtn" class="btn primary">Log in &rarr;</button>
      <div id="loginError" class="error" style="display:none;"></div>
      <div class="authfoot">Don't have an account? <a class="authlink" href="/signup.html">Sign up</a></div>
    </div>
  </div>
  <script src="/auth-common.js"></script>
  <script src="/login.js"></script>
</body>
</html>
